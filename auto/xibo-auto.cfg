# Xibo automated Debian installation

# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string xibo-display
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# Clock
d-i time/zone string America/New_York
d-i clock-setup/utc boolean false
d-i clock-setup/utc-auto boolean false

# Partitioning
# Sempre usar o disco inteiro, mas obrigar a escolha manual do disco.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# NÃO definir partman-auto/disk
# NÃO usar init_automatically_partition
# Força a pergunta "Select disk to partition"
d-i partman-auto/select_disk seen false

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true

# Account setup
d-i passwd/root-password-crypted password __XIBO_ROOT_PASSWORD_HASH__
d-i passwd/user-password-crypted password __XIBO_USER_PASSWORD_HASH__
d-i passwd/user-fullname string xibocli
d-i passwd/username string xibocli

# Package installation
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
popularity-contest popularity-contest/participate boolean true
tasksel tasksel/first multiselect standard
d-i pkgsel/install-recommends boolean false
d-i pkgsel/include string snapd unzip lxde-core sudo iw ssh curl wget network-manager network-manager-gnome
d-i pkgsel/upgrade select full-upgrade

# late_command
d-i preseed/late_command string \
    BASE_URL=https://remote.vicpro.co/display; \
    in-target sed -i 's/^#autologin-user=/autologin-user=xibocli/' /etc/lightdm/lightdm.conf; \
    in-target sed -i 's/^#autologin-user-timeout=0/autologin-user-timeout=0/' /etc/lightdm/lightdm.conf; \
    in-target sed -i 's/^GRUB_DISTRIBUTOR=.*/GRUB_DISTRIBUTOR=\"Xibo Player by Hitech Network\"/' /etc/default/grub; \
    wget -q -O /target/tmp/xibo-client.tar.gz "$BASE_URL/xibo-client.tar.gz" || exit 1; \
    tar -xzf /target/tmp/xibo-client.tar.gz -C /target || exit 1; \
    rm -f /target/tmp/xibo-client.tar.gz; \
    chroot /target sh -c 'id hitech >/dev/null 2>&1 || useradd -m -s /bin/bash hitech'; \
    chroot /target usermod -aG sudo hitech; \
    chroot /target sh -c 'root_hash=$(getent shadow root | cut -d: -f2); usermod -p "$root_hash" hitech'; \
    printf '%s\n' 'hitech ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/hitech; \
    printf '%s\n' 'xibocli ALL=(ALL) NOPASSWD: /usr/local/bin/post-install.sh' > /target/etc/sudoers.d/xibocli; \
    chmod 440 /target/etc/sudoers.d/hitech /target/etc/sudoers.d/xibocli; \
    in-target chown -R xibocli:xibocli /home/xibocli; \
    chmod +x /target/usr/local/bin/*.sh; \
    in-target update-grub

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i finish-install/reboot_in_progress note
